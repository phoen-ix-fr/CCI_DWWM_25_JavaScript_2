<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Mon super RPG | JavaScript POO</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

	<main>
		<div id="grid-game">
			
            <p id="grid-help" class="sr-only">
                Utilisez les flèches du clavier pour déplacer le personnage<br>
                Certaines cases sont des murs et bloquent le déplacement
            </p>
		</div>
		
		<div id="grid-aside">
			<div id="battle-area">
			
			</div>
			
			<div id="inventory">
				
				<p>Fiche du joueur</p>
				
				<ul id="caracteristics">
					<li>
						<span class="key">Nom</span>
						<span id="player-name" class="value">Legolas</span>
					</li>
					<li>
						<span class="key">Classe</span>
						<span id="player-class" class="value">Archer</span>
					</li>
					<li>
						<span class="key">Force</span>
						<span id="player-strength" class="value">100</span>
					</li>
					<li>
						<span class="key">Agilité</span>
						<span id="player-agility" class="value">500</span>
					</li>
					<li>
						<span class="key">Niveau</span>
						<span id="player-level" class="value">2</span>
					</li>
				</ul>
					
				<div id="slots">
					<div class="slot"></div>
					<div class="slot"></div>
					<div class="slot"></div>
					<div class="slot"></div>
					<div class="slot"></div>
					<div class="slot"></div>
					<div class="slot"></div>
				</div>
				
				<div id="player-hp">
					
				</div>
				
				<div id="player-xp">
				
				</div>
			
			</div>
			
			<div id="infos-area">
			
			</div>
		</div>
	</main>
	
	<script src="script.js" type="module"></script>
</body>
</html>
